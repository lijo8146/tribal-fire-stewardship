name: Validate notebooks and companion site
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints.txt
      - run: pip install -r requirements.txt -c constraints.txt
      - name: Check public data and clean notebook sources
        run: python scripts/check_public.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/execute_notebooks.py
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.8.27"
      - run: quarto render
      - run: python scripts/check_site.py
      - uses: actions/upload-artifact@v7
        with:
          name: companion-site-preview
          path: _site
